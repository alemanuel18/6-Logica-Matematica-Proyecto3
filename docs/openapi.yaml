openapi: 3.1.0
info:
  title: API del evaluador semántico
  version: 1.0.0
  description: Analiza y evalúa fórmulas de lógica de primer orden sobre dominios finitos.
servers:
  - url: http://localhost:4000
tags:
  - name: Sistema
  - name: Interpretación
  - name: Fórmulas
paths:
  /api/peano:
    post:
      tags: [Fórmulas]
      summary: Analiza PA, busca demostraciones, comprueba pasos o codifica y decodifica Gödel
      description: |
        Laboratorio independiente de las interpretaciones finitas. Consulte docs/peano.md
        para los campos de cada regla y los límites del convenio de codificación.
        Una prueba inválida responde 200 con valid=false y errores por paso.
        La acción prove devuelve status=proved con un certificado steps reutilizable
        o status=notFound sin afirmar falsedad ni indemostrabilidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [analyze, induction, proof, prove, encode, decode]
                maxSteps:
                  type: integer
                  minimum: 10
                  maximum: 100
                  default: 100
                formula:
                  type: string
                  maxLength: 2000
                body:
                  type: string
                  maxLength: 2000
                variable:
                  type: string
                  pattern: '^[a-z][a-z0-9_]*$'
                number:
                  type: string
                  pattern: '^[1-9][0-9]{0,3999}$'
                steps:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [formula, rule]
                    properties:
                      formula:
                        type: string
                      rule:
                        type: string
                        enum:
                          [
                            axiom,
                            induction,
                            forallElim,
                            forallIntro,
                            mp,
                            refl,
                            sym,
                            trans,
                            successor,
                            congruence,
                            existsIntro,
                            andIntro,
                            andLeft,
                            andRight,
                          ]
                      axiom:
                        type: string
                        enum: [P1, P2, P3, P4, P5, P6]
                      refs:
                        type: array
                        items:
                          type: integer
                          minimum: 1
                      term:
                        type: string
                      operator:
                        type: string
                        enum: ['+', '*']
                      body:
                        type: string
                      variable:
                        type: string
      responses:
        '200':
          description: Resultado de la acción solicitada; enteros de Gödel como cadenas decimales
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Sintaxis, codificación o solicitud inválida
  /api/voice/config:
    get:
      tags: [Sistema]
      summary: Indica si la voz de ElevenLabs está configurada sin exponer secretos
      responses:
        '200':
          description: Disponibilidad de la voz configurada
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
  /api/voice/speech:
    post:
      tags: [Sistema]
      summary: Genera narración con la voz normal o clonada configurada en el servidor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: Narración generada
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '422':
          description: Texto vacío o inválido
        '503':
          description: Falta clave o ID de voz
        '502':
          description: Error de conexión o respuesta fallida de ElevenLabs
  /api/health:
    get:
      tags: [Sistema]
      summary: Comprueba la disponibilidad de la API
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/openapi.yaml:
    get:
      tags: [Sistema]
      summary: Descarga esta especificación OpenAPI
      responses:
        '200':
          description: Documento OpenAPI en YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/tuples:
    post:
      tags: [Interpretación]
      summary: Genera todas las tuplas de D para cada aridad solicitada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, arities]
              properties:
                domain:
                  $ref: '#/components/schemas/Domain'
                arities:
                  type: array
                  items:
                    type: integer
                    minimum: 0
            example:
              domain: [a, b]
              arities: [0, 1]
      responses:
        '200':
          description: Tuplas agrupadas por aridad
          content:
            application/json:
              schema:
                type: object
                required: [tuples]
                properties:
                  tuples:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tuple'
              example:
                tuples:
                  '0': [[]]
                  '1': [[a], [b]]
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/analyze:
    post:
      tags: [Fórmulas]
      summary: Valida la interpretación y detecta variables libres
      description: La interpretación debe estar completa y ser válida.
      requestBody:
        $ref: '#/components/requestBodies/EvaluationInput'
      responses:
        '200':
          description: Variables libres ordenadas alfabéticamente
          content:
            application/json:
              schema:
                type: object
                required: [freeVariables]
                properties:
                  freeVariables:
                    type: array
                    items:
                      type: string
              example:
                freeVariables: [x, y]
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/evaluate:
    post:
      tags: [Fórmulas]
      summary: Evalúa la fórmula y devuelve una justificación
      description: Cada variable libre debe tener un valor del dominio en environment.
      requestBody:
        $ref: '#/components/requestBodies/EvaluationInput'
      responses:
        '200':
          description: Valor de verdad y explicación
          content:
            application/json:
              schema:
                type: object
                required: [truth, result, freeVariables, explanation]
                properties:
                  truth:
                    type: boolean
                  result:
                    type: string
                    enum: [Verdadero, Falso]
                  freeVariables:
                    type: array
                    items:
                      type: string
                  explanation:
                    $ref: '#/components/schemas/Explanation'
              example:
                truth: true
                result: Verdadero
                freeVariables: []
                explanation:
                  value: true
                  reason: 'Testigo: x = a. La tupla (a) pertenece a Pᴵ.'
                  evidence: decisive
                  checks:
                    - assignment: { x: a }
                      value: true
                      reason: La tupla (a) pertenece a Pᴵ.
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  requestBodies:
    EvaluationInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvaluationInput'
          example:
            domain: [a, b]
            functions:
              - name: c
                arity: 0
                table:
                  - args: []
                    value: a
            predicates:
              - name: P
                arity: 1
                tuples: [[a]]
            formula: ∃x.P(x)
            environment: {}
  responses:
    BadRequest:
      description: El cuerpo de la petición no es JSON válido.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
          example:
            error: JSON inválido.
    ValidationError:
      description: Entrada inválida. Esta respuesta no incluye valor de verdad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Falta asignar la variable libre «x».
            field: environment.x
            position: null
  schemas:
    Domain:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
    Tuple:
      type: array
      items:
        type: string
    Function:
      type: object
      required: [name, arity, table]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z_0-9]*$'
        arity:
          type: integer
          minimum: 0
        table:
          type: array
          minItems: 1
          description: Tabla total de D^arity a D; cada tupla de argumentos aparece exactamente una vez.
          items:
            type: object
            required: [args, value]
            properties:
              args:
                $ref: '#/components/schemas/Tuple'
              value:
                type: string
    Predicate:
      type: object
      required: [name, arity, tuples]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z_0-9]*$'
        arity:
          type: integer
          minimum: 0
        tuples:
          type: array
          description: Cada tupla pertenece a D^arity y aparece una vez. Una lista vacía representa un predicado siempre falso.
          items:
            $ref: '#/components/schemas/Tuple'
    EvaluationInput:
      type: object
      required: [domain, formula]
      properties:
        domain:
          $ref: '#/components/schemas/Domain'
        functions:
          type: array
          items:
            $ref: '#/components/schemas/Function'
          default: []
        predicates:
          type: array
          items:
            $ref: '#/components/schemas/Predicate'
          default: []
        formula:
          type: string
          minLength: 1
        environment:
          type: object
          additionalProperties:
            type: string
          default: {}
    Explanation:
      type: object
      required: [value, reason]
      properties:
        value:
          type: boolean
        reason:
          type: string
        evidence:
          type: string
          enum: [decisive, complete]
        checks:
          type: array
          items:
            type: object
            required: [assignment, value, reason]
            properties:
              assignment:
                type: object
                additionalProperties:
                  type: string
              value:
                type: boolean
              reason:
                type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Explanation'
    Error:
      type: object
      required: [error, field, position]
      properties:
        error:
          type: string
        field:
          type: string
        position:
          type: [integer, 'null']
